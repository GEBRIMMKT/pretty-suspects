.next-case{display:inline-grid;gap:10px;justify-items:center;margin-top:clamp(40px,6vw,80px);padding:22px 30px;border:1.5px solid rgba(251,240,230,.35);position:relative}
.next-case .redact{display:block;height:14px;background:var(--paper);width:220px;max-width:60vw}
.next-case .redact + .redact{width:150px}
.end__btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:clamp(40px,6vw,70px)}

/* =====================================================================
   SOBREPOSIÇÕES (índice, lightbox, modal, confirmação, aviso)
   ===================================================================== */
.ov{position:fixed;inset:0;z-index:100;display:none;background:rgba(12,10,10,.94);color:var(--paper);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) var(--gut-r) calc(env(safe-area-inset-bottom,0px) + 20px) var(--gut-l)}
.ov.is-open{display:block;animation:fadein .3s var(--ease)}
@keyframes fadein{from{opacity:0}}
.ov__close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));z-index:3;border:1.5px solid var(--paper);background:var(--ink);font-family:var(--f-mono);font-size:.72rem;letter-spacing:.16em;padding:.7em 1em;min-height:42px}
.index{max-width:1200px;margin:0 auto;padding-top:50px}
.index__top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1.5px solid rgba(251,240,230,.4)}
.index__list{columns:2 340px;column-gap:48px;margin-top:20px}
.index__list a{display:grid;grid-template-columns:3rem 1fr;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid rgba(251,240,230,.12);text-decoration:none;break-inside:avoid}
.index__list a span{font-family:var(--f-mono);font-size:.72rem;opacity:.6}
.index__list a b{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:clamp(1.4rem,2.4vw,2.2rem);line-height:1;transition:color .2s}
.index__list a:hover b,.index__list a.is-current b{color:var(--rose-lit)}
.index__list a.locked b{opacity:.35}
.index__tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;padding-top:20px;border-top:1.5px solid rgba(251,240,230,.4)}
.toggle[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.keys{margin-top:22px;font-family:var(--f-mono);font-size:.74rem;line-height:1.8;opacity:.7}
.keys kbd{font-family:inherit;border:1px solid rgba(251,240,230,.4);padding:.05em .4em;margin-right:.3em}
.lightbox{display:none;place-items:center}
.lightbox.is-open{display:grid}
.lightbox figure{display:grid;gap:14px;justify-items:center;max-width:min(1400px,100%)}
.lightbox img{max-height:82vh;width:auto;max-width:100%;object-fit:contain;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.lightbox figcaption{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.06em;text-align:center;max-width:70ch}
.lightbox figcaption b{display:block;font-family:var(--f-hand);font-size:1.6rem;letter-spacing:0;margin-bottom:4px}
.modal{display:none;place-items:center}
.modal.is-open{display:grid}
.modal__card{background:var(--baby);color:var(--ink);max-width:1100px;width:100%;padding:clamp(22px,4vw,56px);position:relative}
.confirm{display:none;place-items:center;background:rgba(8,6,6,.96)}
.confirm.is-open{display:grid}
.confirm__card{max-width:620px;text-align:center;display:grid;gap:20px;justify-items:center}
.confirm__card .stamp{font-size:clamp(1.4rem,3vw,2.4rem);color:#e23c5e}
.confirm__card h3{font-family:var(--f-sans);font-stretch:62%;font-weight:900;text-transform:uppercase;font-size:var(--fs-l);line-height:.95}
.confirm__card p{font-size:var(--fs-body);opacity:.85}
.confirm__btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;inset:0 auto 0 0;width:0;background:rgba(251,240,230,.35);pointer-events:none}
.hold.is-holding i{width:100%;transition:width var(--hold,1.3s) linear}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%) translateY(20px);z-index:120;background:var(--paper);color:var(--ink);font-family:var(--f-mono);font-size:.8rem;letter-spacing:.06em;padding:.9em 1.2em;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--ease);max-width:calc(100vw - 32px);text-align:center}
.toast.is-on{opacity:1;transform:translateX(-50%) translateY(0)}
.flash{position:fixed;inset:0;z-index:110;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:0}8%{opacity:.92}100%{opacity:0}}

/* =====================================================================
   MODO APRESENTAÇÃO
   ===================================================================== */
.hud{position:fixed;z-index:95;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);display:none;align-items:center;gap:6px;padding:6px;background:rgba(12,10,10,.82);border:1px solid rgba(251,240,230,.18);color:var(--paper);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .5s;max-width:calc(100vw - 24px)}
.is-presenting .hud{display:flex}
.hud.idle{opacity:.12}
.hud button{border:0;background:transparent;min-width:42px;height:42px;font-family:var(--f-mono);font-size:.8rem;letter-spacing:.1em;padding:0 10px}
.hud button:hover{background:rgba(251,240,230,.12)}
.hud__info{display:flex;align-items:center;gap:12px;padding:0 10px;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;white-space:nowrap;overflow:hidden}
.hud__info b{font-weight:700;color:var(--rose-lit)}
.hud__info .t{overflow:hidden;text-overflow:ellipsis;max-width:26vw}
.hud__dots{display:flex;gap:4px}
.hud__dots i{width:6px;height:6px;border-radius:50%;background:rgba(251,240,230,.3)}
.hud__dots i.on{background:var(--rose-lit)}
.hud__bar{position:fixed;left:0;top:0;height:3px;background:var(--rose-lit);z-index:96;display:none;transition:width .4s var(--ease)}
.is-presenting .hud__bar{display:block}

.is-presenting body{overflow:hidden}
.is-presenting .topbar{display:none}
.is-presenting #chapters > .scene{display:none}
.is-presenting #chapters > .scene.is-current > .wrap{margin-block:auto}
.is-presenting #chapters > .scene.is-current{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:clamp(40px,7vh,90px) clamp(70px,10vh,110px);animation:sceneIn .6s var(--ease)}
.is-presenting #chapters > .scene.is-current > .wrap{max-width:min(1760px,100%)}
.is-presenting .lace-top::before,.is-presenting .lace-top::after{display:none}
@keyframes sceneIn{from{opacity:0;transform:translateY(14px)}}
.is-presenting [data-step]:not(.on),.is-presenting [data-step-from]:not(.on){display:none!important}
.is-presenting [data-step].on,.is-presenting [data-step-from].on.just{animation:stepIn .55s var(--ease) both}
@keyframes stepIn{from{opacity:0;transform:translateY(16px)}}
html:not(.is-presenting) [data-pres-only]{display:none!important}
.is-presenting [data-scroll-only]{display:none!important}
.is-presenting{
  --fs-body:clamp(1.1rem,1.35vw,1.9rem);
  --fs-s:clamp(1rem,1.15vw,1.55rem);
  --fs-m:clamp(1.35rem,2vw,2.7rem);
  --fs-label:clamp(.78rem,.85vw,1.1rem);
}
/* ajustes de cada capítulo para projeção */
.is-presenting .hero{padding-top:2vh}
.is-presenting .hero__stage{min-height:0;flex:1}
.is-presenting .concept__grid{align-items:center}
.is-presenting .pillars{margin-top:0;grid-template-columns:repeat(4,minmax(0,1fr))}
.is-presenting .pillar p{font-size:clamp(1.02rem,1.3vw,1.75rem)}
.is-presenting .pillar h3{font-size:clamp(1.5rem,2vw,2.6rem)}
.is-presenting .question{margin-top:0}
.is-presenting .question p{font-size:clamp(3rem,7vw,8rem)}
.is-presenting .mood__grid{grid-template-columns:minmax(0,4fr) minmax(0,6fr);align-items:center}
.is-presenting .mood__head{margin-bottom:3vh}
.is-presenting .mood__board{display:flex;justify-content:center}
.is-presenting .mood__board img{max-height:60vh;width:auto}
.is-presenting .refs{margin-top:0;columns:7 140px}
.is-presenting .id-block{margin-top:0}
.is-presenting .swatches{min-height:58vh}
.is-presenting .fonts{grid-template-columns:repeat(4,minmax(0,1fr))}
.is-presenting .font-card .abc{display:none}
.is-presenting .font-card .aa{font-size:clamp(4rem,7vw,8rem)}
.is-presenting .font-card .sample{font-size:clamp(1.4rem,2.2vw,2.8rem)}
.is-presenting .story__body{margin-top:0;display:block}
.is-presenting .beats{gap:0}
.is-presenting .beat{grid-template-columns:1fr;text-align:center;width:min(1400px,100%);margin-inline:auto}
.is-presenting .beat .n{display:none}
.is-presenting .beat p{font-size:clamp(2.2rem,4.4vw,5.2rem);max-width:20ch;margin-inline:auto}
.is-presenting .beat[data-phone-beat] > div{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6vw;text-align:left}
.is-presenting .beat[data-phone-beat] > div > div{margin-top:0!important}
.is-presenting .beat[data-phone-beat] p{margin-inline:0}
.is-presenting .story__phone{position:relative;top:0}
.is-presenting .phone{width:min(270px,25vh)}
.is-presenting .story__end{margin-top:0}
.is-presenting .story__end .cond{font-size:var(--fs-mega)}
.is-presenting .girls__title{font-size:clamp(3rem,6.4vw,7.5rem)}
.is-presenting .lineup{margin-top:3vh}
.is-presenting .lineup__photo{aspect-ratio:auto;height:44vh}
.is-presenting .dossiers{margin-top:0;display:block}
.is-presenting .dossier{max-width:1600px;margin-inline:auto;grid-template-columns:minmax(0,4fr) minmax(0,8fr);grid-template-rows:auto auto 1fr;column-gap:clamp(24px,3.5vw,64px)}
.is-presenting .dossier__photo{grid-row:1 / span 3;align-self:start}
.is-presenting .dossier__photo .ph{max-height:58vh;aspect-ratio:4/5}
.is-presenting .dossier__name{font-size:clamp(3rem,6vw,7rem)}
.is-presenting .dossier__fields{grid-column:2;grid-template-columns:1fr 1fr}
.is-presenting .dossier__fields dd{font-size:clamp(1rem,1.25vw,1.6rem)}
.is-presenting .dossier__quote{grid-column:2}
.is-presenting .fan{height:46vh;margin-top:4vh}
.is-presenting .fan__card{width:min(16vw,27vh)}
.is-presenting .viewer{margin-top:0;align-items:center}
.is-presenting .viewer__tabs{display:none}
.is-presenting .flip{width:min(100%,50vh)}
.is-presenting #evidence .lede,.is-presenting #cards .pending{display:none}
.is-presenting .ev__title{font-size:clamp(2.6rem,5.2vw,6.4rem);max-width:none}
.is-presenting .board{aspect-ratio:16/9;margin-inline:auto;margin-top:3vh;width:min(100%,calc((100vh - 300px) * 16 / 9))}
.is-presenting .ev-detail__vis{max-width:min(100%,52vh)}
.is-presenting .tl__title{font-size:clamp(2.6rem,5.2vw,6.4rem);max-width:none}
.is-presenting .axis-wrap{margin-top:3vh}
.is-presenting .tl-cards{margin-top:2vh}
.is-presenting .tl-card p{font-size:clamp(.95rem,1.1vw,1.4rem)}
.is-presenting .tl-card--declaracao p{font-size:clamp(1.2rem,1.5vw,1.9rem)}
.is-presenting .prod__hero .media,.is-presenting .prod__hero .slot{max-height:60vh}
.is-presenting .prod__pages .slot,.is-presenting .prod__pages .media{max-height:58vh}
.is-presenting .pack__grid{margin-top:3vh;align-items:center}
.is-presenting .entries{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:3vh}
.is-presenting .rules{margin-top:3vh;grid-template-columns:1fr}
.is-presenting .rules li p{font-size:clamp(1.4rem,2.4vw,3.2rem)}
.is-presenting .suspects{margin-top:3vh}
.is-presenting .suspect__ph{aspect-ratio:auto;height:36vh}
.is-presenting .team .polaroid__img{aspect-ratio:auto;height:34vh}
.is-presenting .roll{margin-top:0}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .ticker__track,.tape-band span{animation:none!important;padding-left:0}
  .flash{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <div class="topbar__in">
      <a class="brandmark" href="#home" aria-label="Pretty Suspects — voltar ao início"><b>PRETTY <span>SUSPECTS</span></b><small>CASE 001</small></a>
      <nav class="navlinks" id="navlinks" aria-label="Capítulos"></nav>
      <div class="topbar__actions">
        <button class="btn btn--ghost" type="button" data-action="index" aria-haspopup="dialog">Index</button>
        <button class="btn btn--solid" type="button" data-action="present"><span class="dot" aria-hidden="true"></span>Presentation</button>
      </div>
    </div>
    <div class="progress" id="progress" aria-hidden="true"></div>
  </header>

  <main id="chapters"></main>

  <!-- índice / menu rápido -->
  <div class="ov" id="ov-index" role="dialog" aria-modal="true" aria-label="Índice do arquivo">
    <button class="ov__close" type="button" data-action="close">Fechar ✕</button>
    <div class="index">
      <div class="index__top">
        <div><p class="label" style="opacity:.6">Classified file · Case No. 001</p><h2 class="disp" style="font-size:var(--fs-xl);margin-top:8px">The Index</h2></div>
        <p class="hand" style="font-size:1.6rem;color:var(--rose-lit)">trust no one.</p>
      </div>
      <nav class="index__list" id="index-list" aria-label="Todos os capítulos"></nav>
      <div class="index__tools">
        <button class="btn btn--solid" type="button" data-action="present">Presentation mode</button>
        <button class="btn btn--ghost toggle" type="button" data-action="toggle-notes" id="tg-notes" aria-pressed="true">Pendências</button>
        <button class="btn btn--ghost toggle" type="button" data-action="toggle-sound" id="tg-sound" aria-pressed="false">Som</button>
        <button class="btn btn--ghost" type="button" data-action="reset">Reiniciar investigação</button>
      </div>
      <p class="keys" id="keys-help">Modo apresentação: <kbd>→</kbd><kbd>espaço</kbd> avança · <kbd>←</kbd> volta · <kbd>M</kbd> menu · <kbd>F</kbd> tela cheia · <kbd>Esc</kbd> sai</p>
    </div>
  </div>

  <!-- ampliar imagem -->
  <div class="ov lightbox" id="ov-light" role="dialog" aria-modal="true" aria-label="Imagem ampliada">
    <button class="ov__close" type="button" data-action="close">Fechar ✕</button>
    <figure><img id="light-img" alt=""><figcaption id="light-cap"></figcaption></figure>
  </div>

  <!-- evidência aberta -->
  <div class="ov modal" id="ov-ev" role="dialog" aria-modal="true" aria-label="Evidência">
    <button class="ov__close" type="button" data-action="close">Fechar ✕</button>
    <div class="modal__card" id="ev-modal-body"></div>
  </div>

  <!-- confirmação -->
  <div class="ov confirm" id="ov-confirm" role="alertdialog" aria-modal="true" aria-labelledby="cf-title">
    <div class="confirm__card">
      <span class="stamp" id="cf-stamp">Spoiler</span>
      <h3 id="cf-title"></h3>
      <p id="cf-text"></p>
      <div class="confirm__btns">
        <button class="btn btn--ghost" type="button" data-action="close">Cancelar</button>
        <button class="btn btn--solid hold" type="button" id="cf-ok"><i></i><span id="cf-ok-label"></span></button>
      </div>
      <p class="label" id="cf-hint" style="opacity:.6"></p>
    </div>
  </div>

  <!-- controles do modo apresentação -->
  <div class="hud__bar" id="hud-bar" aria-hidden="true"></div>
  <div class="hud" id="hud" role="toolbar" aria-label="Controles da apresentação">
    <button type="button" data-action="prev" aria-label="Voltar">←</button>
    <div class="hud__info"><b id="hud-n">01</b><span class="t" id="hud-t">THE OPENING</span><span class="hud__dots" id="hud-dots"></span></div>
    <button type="button" data-action="next" aria-label="Avançar">→</button>
    <button type="button" data-action="index" aria-label="Menu de capítulos">≡</button>
    <button type="button" data-action="fullscreen" aria-label="Tela cheia">⤢</button>
    <button type="button" data-action="exit" aria-label="Sair do modo apresentação">✕</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>
</div>
<script src="data.js"></script>
<script src="segredo.js"></script>
<script src="app.js"></script>
</body>
</html>
